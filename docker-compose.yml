services:

  # ── Ollama: local LLM inference (planner + lyrics) ────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: chordai-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    # Pull required models on first start
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "ollama serve &
       sleep 5 &&
       ollama pull llama3.2 &&
       ollama pull gemma4 &&
       wait"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ── Go + Python: backend server + AI model scripts ────────────────────────
  server:
    build:
      context: .
      dockerfile: server/Dockerfile.combined
    container_name: chordai-server
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-5555}:5555"
    environment:
      - PORT=5555
      - OLLAMA_HOST=http://ollama:11434
    volumes:
      # Persist generated lyrics JSON and images
      - output-data:/app/out-chords
      # Mount chord model checkpoint (trained separately, not in repo)
      - ./chord-gen/nanoGPT/out-CHORDv2:/app/chord-gen/nanoGPT/out-CHORDv2:ro
    depends_on:
      - ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ── Nuxt: frontend ────────────────────────────────────────────────────────
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: chordai-client
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:-3000}:3000"
    environment:
      - NUXT_PUBLIC_SERVER_URL=http://server:5555
    depends_on:
      - server

volumes:
  ollama-data:
  output-data:
